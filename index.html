<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hustle Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            padding: 16px;
        }

        .header {
            background: #141419;
            border: 1px solid #22222a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header h2 {
            font-size: 16px;
            letter-spacing: 1px;
            color: #8e8e93;
        }

        .balance {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-tabs {
            display: flex;
            background: #141419;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #8e8e93;
            font-weight: bold;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000000;
        }

        .pool-card {
            background: #141419;
            border: 1px solid #22222a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #8e8e93;
            font-size: 14px;
        }

        .case-card {
            background: #141419;
            border: 1px solid #22222a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .case-card:hover {
            border-color: #33333f;
        }

        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .open-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .case-details {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #22222a;
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .gift-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .gift-badge small {
            color: #ff007a;
            font-weight: bold;
        }

        /* CRASH STYLES */
        .crash-container {
            background: #141419;
            border: 1px solid #22222a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .crash-display {
            background: #0b0b0e;
            border: 1px solid #22222a;
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 16px;
        }

        .crash-mult {
            font-size: 38px;
            font-weight: 900;
            color: #fff;
        }

        .crash-status {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }

        .input-group label {
            font-size: 12px;
            color: #8e8e93;
            display: block;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0b0b0e;
            border: 1px solid #22222a;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>HUSTLE HUB</h2>
        <div class="balance" id="user-balance">0 ⭐</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('cases')">Кейсы</button>
        <button class="tab-btn" onclick="switchTab('crash')">Краш</button>
    </div>

    <div id="tab-cases">
        <div class="pool-card">
            <span>Пул выплат системы</span>
            <strong style="color: #fff;" id="payout-pool">0 ⭐</strong>
        </div>
        <div id="cases-list"></div>
    </div>

    <div id="tab-crash" style="display: none;">
        <div class="crash-container">
            <div class="crash-display">
                <div class="crash-mult" id="crash-mult">1.00x</div>
                <div class="crash-status" id="crash-status">ГОТОВ К ЗАПУСКУ</div>
            </div>

            <div class="input-group">
                <label>Сумма ставки (⭐)</label>
                <input type="number" id="crash-bet" value="50">
            </div>

            <div class="input-group">
                <label>Целевой множитель (X)</label>
                <input type="number" id="crash-target" value="2.0" step="0.1">
            </div>

            <button class="action-btn" onclick="playCrash()">Запустить ракету</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 12345678;

        async function updateBalance() {
            try {
                const res = await fetch(`/api/user/${userId}`);
                const data = await res.json();
                document.getElementById('user-balance').innerText = `${data.balance} ⭐`;
            } catch (e) {
                console.error(e);
            }
        }

        async function loadCases() {
            try {
                const res = await fetch('/api/cases');
                const data = await res.json();
                document.getElementById('payout-pool').innerText = `${data.payout_pool} ⭐`;

                const casesList = document.getElementById('cases-list');
                casesList.innerHTML = '';

                data.cases.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'case-card';

                    const giftsHtml = c.gifts.map(g => `
                        <div class="gift-badge">
                            <span>${g.name}</span>
                            <small>${g.price} ⭐</small>
                        </div>
                    `).join('');

                    card.innerHTML = `
                        <div class="case-header" onclick="toggleDetails('${c.id}')">
                            <div>
                                <h3 style="margin: 0; font-size: 16px;">${c.name}</h3>
                                <p style="margin: 4px 0 0; color: #8e8e93; font-size: 13px;">Стоимость: ${c.price} ⭐</p>
                            </div>
                            <button class="open-btn" onclick="event.stopPropagation(); spinCase('${c.id}')">Открыть</button>
                        </div>
                        <div id="details-${c.id}" class="case-details">
                            <p style="font-size: 12px; color: #8e8e93; margin-bottom: 8px;">Содержимое кейса (нажмите чтобы скрыть):</p>
                            <div class="gifts-grid">
                                ${giftsHtml}
                            </div>
                        </div>
                    `;
                    casesList.appendChild(card);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function toggleDetails(id) {
            const el = document.getElementById(`details-${id}`);
            if (el) {
                el.style.display = el.style.display === 'block' ? 'none' : 'block';
            }
        }

        async function spinCase(caseType) {
            try {
                const res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, case_type: caseType })
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    alert(`🎉 Вы выбили: ${data.won_gift.name}! Подарок отправлен вам в чат.`);
                } else {
                    alert(data.message || data.detail || "Ошибка при открытии");
                }
                updateBalance();
                loadCases();
            } catch (e) {
                alert("Ошибка сети");
            }
        }

        async function playCrash() {
            const bet = parseInt(document.getElementById('crash-bet').value);
            const target = parseFloat(document.getElementById('crash-target').value);

            if (!bet || !target) return alert("Введите ставку и множитель");

            const statusEl = document.getElementById('crash-status');
            const multEl = document.getElementById('crash-mult');
            statusEl.innerText = "РАКЕТА ЛЕТИТ...";
            statusEl.style.color = "#ffb700";

            try {
                const res = await fetch('/api/crash/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, bet: bet, target_multiplier: target })
                });
                const data = await res.json();

                if (!res.ok) {
                    statusEl.innerText = "ОШИБКА";
                    statusEl.style.color = "#ff3b30";
                    return alert(data.detail || "Ошибка");
                }

                multEl.innerText = `${data.crashed_at.toFixed(2)}x`;

                if (data.won) {
                    statusEl.innerText = `ПОБЕДА! +${data.payout} ⭐`;
                    statusEl.style.color = "#34c759";
                } else {
                    statusEl.innerText = "КРАШ! СТАВКА СГОРЕЛА";
                    statusEl.style.color = "#ff3b30";
                }

                updateBalance();
                loadCases();
            } catch (e) {
                statusEl.innerText = "ОШИБКА СЕТИ";
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'cases') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-cases').style.display = 'block';
                document.getElementById('tab-crash').style.display = 'none';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-cases').style.display = 'none';
                document.getElementById('tab-crash').style.display = 'block';
            }
        }

        updateBalance();
        loadCases();
    </script>
</body>
</html>
