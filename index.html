<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hustle Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f0f13;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 80px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .balance-badge {
            background: #1a1a24;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #f39c12;
            border: 1px solid #2a2a3b;
        }
        .mode-toggle {
            display: flex;
            background: #1a1a24;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3b;
        }
        .mode-btn {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: #33334d;
            color: #fff;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .case-card {
            background: #16161f;
            border: 1px solid #252536;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .case-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .case-info p {
            font-size: 13px;
            color: #a0a0b0;
        }
        .case-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: #f39c12;
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-secondary {
            background: #252536;
            color: #fff;
        }
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }
        .modal-content {
            background: #16161f;
            width: 100%;
            max-height: 80vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            border-top: 1px solid #2a2a3b;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .gift-item {
            background: #1f1f2e;
            border: 1px solid #2d2d42;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .gift-item p {
            font-size: 12px;
            margin-top: 6px;
            color: #f39c12;
        }
    </style>
</head>
<body>

    <header>
        <h1>Hustle Case</h1>
        <div class="balance-badge" id="user-balance">0 ⭐</div>
    </header>

    <div class="mode-toggle">
        <button class="mode-btn active" id="mode-real" onclick="setMode(false)">💰 Реальный режим</button>
        <button class="mode-btn" id="mode-demo" onclick="setMode(true)">🎮 Демо-режим</button>
    </div>

    <div class="cases-grid" id="cases-container">
        <!-- Кейсы подгружаются динамически через JS -->
    </div>

    <!-- Модальное окно просмотра подарков и открытия -->
    <div class="modal" id="case-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-case-title">Название кейса</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <p style="font-size: 13px; color: #a0a0b0; margin-bottom: 12px;">Возможные призы в кейсе:</p>
            <div class="gifts-grid" id="modal-gifts-grid">
                <!-- Список подарков -->
            </div>
            <button class="btn" style="width: 100%; padding: 14px; font-size: 15px;" id="modal-open-btn" onclick="spinCurrentCase()">Открыть кейс</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || 123456789; // Тестовый ID, если запуск не из Telegram
        let userBalance = 0;
        let isDemo = false;
        let currentCaseId = null;
        let casesData = [];

        async function init() {
            await loadUser();
            await loadCases();
        }

        async function loadUser() {
            try {
                let res = await fetch(`/api/deposit`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, amount: 0 }) // Просто инициализация/проверка
                });
                // Или можно сделать отдельный запрос баланса, если настроен эндпоинт
            } catch (e) {
                console.log(e);
            }
        }

        async function loadCases() {
            let res = await fetch('/api/cases');
            let data = await res.json();
            casesData = data.cases;
            renderCases();
        }

        function renderCases() {
            const container = document.getElementById('cases-container');
            container.innerHTML = '';
            casesData.forEach(c => {
                container.innerHTML += `
                    <div class="case-card">
                        <div class="case-info">
                            <h3>${c.name}</h3>
                            <p>${c.price} ⭐</p>
                        </div>
                        <div class="case-actions">
                            <button class="btn btn-secondary" onclick="openCaseModal('${c.id}')">Содержимое</button>
                            <button class="btn" onclick="quickSpin('${c.id}')">Открыть</button>
                        </div>
                    </div>
                `;
            });
        }

        function setMode(demo) {
            isDemo = demo;
            document.getElementById('mode-real').classList.toggle('active', !demo);
            document.getElementById('mode-demo').classList.toggle('active', demo);
        }

        function openCaseModal(caseId) {
            currentCaseId = caseId;
            let c = casesData.find(item => item.id === caseId);
            if (!c) return;

            document.getElementById('modal-case-title').innerText = `${c.name} (${c.price} ⭐)`;
            
            let grid = document.getElementById('modal-gifts-grid');
            grid.innerHTML = '';
            c.gifts.forEach(g => {
                grid.innerHTML += `
                    <div class="gift-item">
                        <div style="font-size: 24px;">🎁</div>
                        <div style="font-size: 13px; font-weight: 500; margin-top: 4px;">${g.name}</div>
                        <p>${g.price} ⭐</p>
                    </div>
                `;
            });

            document.getElementById('case-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('case-modal').style.display = 'none';
        }

        async function quickSpin(caseId) {
            currentCaseId = caseId;
            spinCurrentCase();
        }

        async function spinCurrentCase() {
            try {
                let res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        case_type: currentCaseId,
                        is_demo: isDemo
                    })
                });
                let data = await res.json();
                
                if (res.ok) {
                    alert(`${data.message}\nВыиграл: ${data.won_gift.name} (${data.won_gift.price} ⭐)`);
                    closeModal();
                } else {
                    alert(data.detail || "Ошибка открытия кейса");
                }
            } catch (e) {
                alert("Ошибка соединения с сервером");
            }
        }

        init();
    </script>
</body>
</html>
