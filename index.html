<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hustle Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f11;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .balance-box {
            background: #1a1a1e;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            border: 1px solid #2d2d35;
        }
        .btn {
            background: #f39c12;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .cases-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .case-card {
            background: #1a1a1e;
            border: 1px solid #2d2d35;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .case-card:hover {
            border-color: #f39c12;
        }

        /* Modal window & Roulette */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        .roulette-window {
            width: 300px;
            height: 120px;
            overflow: hidden;
            position: relative;
            background: #1a1a1e;
            border-radius: 12px;
            border: 2px solid #f39c12;
            margin-bottom: 20px;
        }
        .roulette-pointer {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 4px; 
            height: 100%;
            background: #ff4757;
            z-index: 10;
            box-shadow: 0 0 8px #ff4757;
        }
        .roulette-tape {
            display: flex;
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            will-change: transform;
        }
        .roulette-item {
            width: 100px;
            height: 120px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #25252b;
            border-right: 1px solid #33333d;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 4px;
        }
        .result-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            min-height: 28px;
            color: #f39c12;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin: 0;">Hustle Case</h2>
        <div class="balance-box">Balance: <span id="balance">0</span> ⭐</div>
        <button class="btn" onclick="topUp()">Top Up</button>
    </div>

    <div class="cases-container" id="cases-list">
        <!-- Cases load dynamically -->
    </div>

    <!-- Roulette Modal -->
    <div class="modal" id="roulette-modal">
        <div class="result-text" id="result-text">Spinning...</div>
        <div class="roulette-window">
            <div class="roulette-pointer"></div>
            <div class="roulette-tape" id="roulette-tape"></div>
        </div>
        <button class="btn" id="close-modal-btn" style="display:none;" onclick="closeModal()">Claim Prize</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 12345678;
        let casesData = [];

        async function init() {
            await fetchUser();
            await fetchCases();
        }

        async function fetchUser() {
            try {
                const res = await fetch(`/api/user/${userId}`);
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance;
            } catch (e) {
                console.error("User fetch error:", e);
            }
        }

        async function fetchCases() {
            try {
                const res = await fetch('/api/cases');
                const data = await res.json();
                casesData = data.cases;
                renderCases();
            } catch (e) {
                console.error("Cases fetch error:", e);
            }
        }

        function renderCases() {
            const container = document.getElementById('cases-list');
            container.innerHTML = '';
            casesData.forEach(c => {
                container.innerHTML += `
                    <div class="case-card" onclick="openCase('${c.id}')">
                        <div>
                            <div style="font-size: 16px; font-weight: bold;">${c.name}</div>
                            <div style="color: #888; font-size: 13px; margin-top: 4px;">🎁 Open for prizes</div>
                        </div>
                        <div style="font-size: 16px; font-weight: bold; color: #f39c12;">${c.price} ⭐</div>
                    </div>
                `;
            });
        }

        async function topUp() {
            const amount = prompt("How many stars do you want to deposit?", "100");
            if (!amount || isNaN(amount)) return;
            try {
                const res = await fetch('/api/create-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, amount: parseInt(amount) })
                });
                const data = await res.json();
                if (data.invoice_link) {
                    tg.openInvoice(data.invoice_link, async (status) => {
                        if (status === 'paid') {
                            alert("Payment successful!");
                            await fetchUser();
                        }
                    });
                }
            } catch (e) {
                alert("Error creating invoice");
            }
        }

        async function openCase(caseId) {
            const modal = document.getElementById('roulette-modal');
            const tape = document.getElementById('roulette-tape');
            const resultText = document.getElementById('result-text');
            const closeBtn = document.getElementById('close-modal-btn');

            modal.style.display = 'flex';
            resultText.innerText = 'Spinning...';
            closeBtn.style.display = 'none';
            
            // Reset transition and offset for instant redraw
            tape.style.transition = 'none';
            tape.style.transform = 'translateX(0px)';
            tape.innerHTML = '';

            try {
                const res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, case_id: caseId, is_demo: false })
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Opening error");
                    modal.style.display = 'none';
                    return;
                }

                const data = await res.json();

                // Render exact server-generated tape
                data.roulette_tape.forEach(gift => {
                    const item = document.createElement('div');
                    item.className = 'roulette-item';
                    item.innerHTML = `
                        <span style="font-size: 24px;">🎁</span>
                        <span style="margin-top:6px; word-break: break-word;">${gift.name}</span>
                        <span style="color:#f39c12; margin-top:2px;">${gift.price} ⭐</span>
                    `;
                    tape.appendChild(item);
                });

                // Exact alignment calculation:
                // Card width = 100px.
                // Center of item at winningIndex = (winningIndex * 100) + 50.
                // Container width = 300px, so center is at 150px.
                const cardWidth = 100;
                const containerWidth = 300;
                const winningIndex = data.winner_index; // Index 25
                const targetOffset = (winningIndex * cardWidth) - (containerWidth / 2) + (cardWidth / 2);

                // Start smooth spin animation
                setTimeout(() => {
                    tape.style.transition = 'transform 4s cubic-bezier(0.12, 0.8, 0.15, 1)';
                    tape.style.transform = `translateX(-${targetOffset}px)`;
                }, 50);

                // Show result string matching the landed item after spin
                setTimeout(() => {
                    resultText.innerText = `You won: ${data.won_gift.name} (${data.won_gift.price} ⭐)!`;
                    closeBtn.style.display = 'block';
                    document.getElementById('balance').innerText = data.new_balance;
                }, 4100);

            } catch (e) {
                alert("Server connection error");
                modal.style.display = 'none';
            }
        }

        function closeModal() {
            document.getElementById('roulette-modal').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
