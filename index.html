<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hustle NFT Case & Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(15, 17, 23, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #8c909d;
            --accent: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        /* --- ПЕРЕЛИВАЮЩИЙСЯ ФОН И ЧАСТИЦЫ --- */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -2;
            background: radial-gradient(circle at 20% 20%, rgba(40, 40, 50, 0.3) 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(20, 20, 25, 0.4) 0%, transparent 50%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.05) translate(-10px, 15px); }
            100% { transform: scale(1) translate(10px, -10px); }
        }

        /* Мелкие летающие белые частицы */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-5vh) translateX(30px); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1;
            padding-bottom: 40px;
        }

        /* Header / Bento Card */
        .bento-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s;
        }
        .bento-card:hover {
            border-color: var(--card-border-hover);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .balance-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        /* Pool Box */
        .pool-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.1);
        }
        .pool-title { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .pool-val { font-size: 18px; font-weight: 700; color: #fff; }

        /* Sections */
        .section { display: none; flex-direction: column; gap: 12px; }
        .section.active { display: flex; }

        /* Case Item Card */
        .case-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            transition: transform 0.2s, border-color 0.3s;
        }
        .case-item:active { transform: scale(0.98); }
        .case-item:hover { border-color: var(--card-border-hover); }

        .case-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #fff; }
        .case-price { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .action-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .action-btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Crash Section */
        .crash-screen {
            background: #020204;
            border-radius: 14px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
        }
        .crash-mult { font-size: 40px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .crash-status { font-size: 12px; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .input-group input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: rgba(255,255,255,0.4); }

        /* Modal Result */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        .modal-content {
            background: #0e1017;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-content h3 { font-size: 20px; font-weight: 800; color: #fff; }
        .modal-content p { font-size: 15px; color: var(--text-muted); line-height: 1.4; }
        .modal-content p b { color: #fff; }
    </style>
</head>
<body>

    <!-- Переливающийся фон -->
    <div class="bg-glow"></div>

    <!-- Летающие белые частицы -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Header / Balance Bento -->
        <div class="bento-card">
            <div class="header-top">
                <span class="brand">Hustle Hub</span>
                <div class="balance-val" id="user-balance">0 ⭐</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('cases')">Кейсы</button>
            <button class="tab-btn" onclick="switchTab('crash')">Краш</button>
        </div>

        <!-- Pool Bento -->
        <div class="bento-card pool-box">
            <span class="pool-title">Пул выплат системы</span>
            <span class="pool-val" id="payout-pool">0 ⭐</span>
        </div>

        <!-- CASES SECTION -->
        <div id="cases-section" class="section active">
            <div id="cases-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- CRASH SECTION -->
        <div id="crash-section" class="section">
            <div class="bento-card" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="crash-screen">
                    <span class="crash-mult" id="crash-display">1.00x</span>
                    <span class="crash-status" id="crash-status">Готов к запуску</span>
                </div>
                <div class="input-group">
                    <label>Сумма ставки (⭐)</label>
                    <input type="number" id="crash-bet" value="50" min="1">
                </div>
                <div class="input-group">
                    <label>Целевой множитель (X)</label>
                    <input type="number" step="0.1" id="crash-target" value="2.0" min="1.1">
                </div>
                <button class="action-btn" style="width: 100%; padding: 14px;" onclick="playCrash()">Запустить ракету</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="result-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modal-title">Результат</h3>
            <p id="modal-text">Вы выиграли...</p>
            <button class="action-btn" onclick="closeModal()">Понятно</button>
        </div>
    </div>

    <script>
        // Генерация летающих белых частиц
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 3 + 1;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDuration = `${Math.random() * 8 + 6}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(p);
        }

        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 12345;

        let userBalance = 0;

        async function loadData() {
            try {
                const res = await fetch(`/api/cases`);
                const data = await res.json();
                document.getElementById('payout-pool').innerText = data.payout_pool + ' ⭐';
                
                const casesContainer = document.getElementById('cases-list');
                casesContainer.innerHTML = '';
                data.cases.forEach(c => {
                    casesContainer.innerHTML += `
                        <div class="case-item">
                            <div class="case-info">
                                <h3>${c.name}</h3>
                                <span class="case-price">Стоимость: ${c.price} ⭐</span>
                            </div>
                            <button class="action-btn" onclick="spinCase('${c.id}')">Открыть</button>
                        </div>
                    `;
                });

                const userRes = await fetch(`/api/user/${userId}`);
                const userData = await userRes.json();
                userBalance = userData.balance;
                document.getElementById('user-balance').innerText = userBalance + ' ⭐';
            } catch (e) {
                console.error("Ошибка загрузки", e);
            }
        }

        async function spinCase(caseType) {
            try {
                // Если баланса нет или мало, при открытии кейса вызываем инвойс/пополнение через звезды Телеграма или проверяем баланс
                const res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, case_type: caseType })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    userBalance = data.new_balance;
                    document.getElementById('user-balance').innerText = userBalance + ' ⭐';
                    showModal("Кейс открыт!", data.message);
                    loadData();
                } else {
                    showModal("Внимание", data.message || "Недостаточно звезд на балансе");
                }
            } catch (e) {
                showModal("Ошибка", "Недостаточно звезд на балансе. Пополните счет через бота.");
            }
        }

        async function playCrash() {
            const bet = parseInt(document.getElementById('crash-bet').value);
            const target = parseFloat(document.getElementById('crash-target').value);

            try {
                const res = await fetch('/api/crash/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, bet: bet, target_multiplier: target })
                });
                const data = await res.json();
                if (data.success) {
                    userBalance = data.new_balance;
                    document.getElementById('user-balance').innerText = userBalance + ' ⭐';
                    document.getElementById('crash-display').innerText = data.crashed_at + 'x';
                    
                    if (data.won) {
                        showModal("Победа в Краше! 🚀", `Ракета долетела до ${data.crashed_at}x!<br>Выигрыш: <b>+${data.payout} ⭐</b>`);
                    } else {
                        showModal("Краш! 💥", `Ракета упала на ${data.crashed_at}x (цель была ${target}x). Ставка сгорела.`);
                    }
                    loadData();
                }
            } catch (e) {
                showModal("Ошибка", "Недостаточно средств для ставки");
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'cases') {
                document.querySelector('.nav-tabs button:nth-child(1)').classList.add('active');
                document.getElementById('cases-section').classList.add('active');
            } else {
                document.querySelector('.nav-tabs button:nth-child(2)').classList.add('active');
                document.getElementById('crash-section').classList.add('active');
            }
        }

        function showModal(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerHTML = text;
            document.getElementById('result-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        loadData();
    </script>
</body>
</html>
